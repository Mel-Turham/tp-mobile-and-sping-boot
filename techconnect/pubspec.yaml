name: techconnect
description: Application de mise en relation avec techniciens
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Navigation
  go_router: ^12.1.1

  # HTTP Client
  dio: ^5.4.0

  # Stockage local
  shared_preferences: ^2.2.2
  intl: ^0.19.0

  # UI
  google_fonts: ^6.1.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # State Management (simple avec ChangeNotifier)
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true